<title>Swirl Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@500;600;700&display=swap">
<style>
/* Layout: one full-bleed stage, a quiet brand + option chips floating top, a glass tab dock bottom. Deliberately single dark theme: the toys glow. */
:root{
  --bg:#0b0d13;
  --ink:#eef0f7;
  --muted:#9aa1b6;
  --glass:rgba(22,25,36,.62);
  --line:rgba(255,255,255,.12);
  --accent:#c7b8ff;
  --display:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --ui:'Figtree','Helvetica Neue',Arial,system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--ui);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;touch-action:none;cursor:crosshair}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.top{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none;z-index:3}
.top>*{pointer-events:auto}
.brand{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.02em;line-height:1.05;text-shadow:0 1px 12px rgba(0,0,0,.5)}
.brand span{display:block;font-family:var(--ui);font-weight:600;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.chips{display:flex;flex-wrap:nowrap;gap:6px;max-width:72%;overflow-x:auto;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent);padding-right:18px;overscroll-behavior-x:contain}
.chips::-webkit-scrollbar{display:none}
.chips>:first-child{margin-left:auto}
.chip{flex:none}
.chip{font:600 12.5px/1 var(--ui);color:var(--ink);background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:8px 12px;cursor:pointer;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip:hover{border-color:rgba(255,255,255,.28)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.stat{cursor:default;color:var(--muted)}
.tabs{position:fixed;left:50%;transform:translateX(-50%);overflow-x:auto;scrollbar-width:none;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;gap:2px;padding:5px;background:var(--glass);border:1px solid var(--line);border-radius:24px;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);z-index:3;max-width:calc(100% - 24px)}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:60px;padding:8px 6px 7px;border-radius:19px;border:0;background:transparent;color:var(--muted);font:600 11px/1 var(--ui);cursor:pointer;transition:background .2s,color .2s}
.tab svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab.on{background:rgba(255,255,255,.12);color:var(--ink)}
.tab:hover{color:var(--ink)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto}
.ctl{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 94px);display:flex;align-items:center;justify-content:center;gap:12px;z-index:2;font:600 13px/1 var(--ui);color:var(--muted);font-variant-numeric:tabular-nums}
.ctl input{flex:1;max-width:440px;min-width:0;accent-color:var(--accent);height:28px}
.ctl output{min-width:150px;color:var(--ink)}
.ctl[hidden]{display:none}
body.has-ctl .hint{bottom:calc(env(safe-area-inset-bottom,0px) + 136px)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 94px);text-align:center;font:600 14px/1.35 var(--ui);color:rgba(238,240,247,.82);text-shadow:0 1px 10px rgba(0,0,0,.7);pointer-events:none;transition:opacity .9s;z-index:2;text-wrap:balance}
.hint.gone{opacity:0}
.sub{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 94px);text-align:center;font:600 12px/1.3 var(--ui);color:var(--muted);pointer-events:none;z-index:1;font-variant-numeric:tabular-nums}
.disc{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 64px);transform:translateX(-50%);width:min(320px,calc(100% - 24px));background:rgba(24,22,40,.84);border:1px solid rgba(199,184,255,.32);border-radius:12px;padding:7px 12px;z-index:4;pointer-events:none;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);transition:opacity .5s,transform .5s;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.disc small{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}
.disc b{font:800 15px/1.2 var(--display)}
.disc p{margin:1px 0 0;font-size:12.5px;line-height:1.35;color:#d4d7e4}
.disc.out{opacity:0;transform:translate(-50%,-8px)}
@media (max-width:380px){.tab{min-width:52px}.brand{font-size:17px}}
@media (prefers-reduced-motion:reduce){.hint,.tab{transition:none}}
</style>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const stage = $('#stage'), glc = $('#gl'), c2 = $('#c2'), ctx = c2.getContext('2d');
const chipsEl = $('#chips'), hintEl = $('#hint'), subEl = $('#sub'), tabsEl = $('#tabs'), modeNameEl = $('#modeName');
let W = innerWidth, H = innerHeight, DPR = Math.min(devicePixelRatio || 1, 2);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rand = (a, b) => a + Math.random() * (b - a);
const store = {
  get(k, d) { try { const v = localStorage.getItem('swirlroom.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('swirlroom.' + k, JSON.stringify(v)); } catch (e) {} }
};
function hsl(h, s, l) { // h 0..1, s,l 0..1 -> [r,g,b] 0..1
  h = ((h % 1) + 1) % 1;
  const a = s * Math.min(l, 1 - l);
  const f = n => { const k = (n + h * 12) % 12; return l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)); };
  return [f(0), f(8), f(4)];
}
const wave = h => 0.5 - 0.5 * Math.cos(h * Math.PI * 2); // periodic sweep 0..1..0
// the playable area between the top chrome and the tab dock
function bounds() {
  const tr = tabsEl.getBoundingClientRect();
  return { top: 64, bottom: Math.max(200, tr.top - 10) };
}

/* ---------------- Sound: everything synthesized, nothing sampled ---------------- */
const Snd = {
  ctx: null, on: store.get('sound', true), master: null, noise: null,
  unlock() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    try { this.ctx = new AC(); } catch (e) { return; }
    const c = this.ctx;
    this.master = c.createGain(); this.master.gain.value = this.on ? 0.9 : 0;
    const comp = c.createDynamicsCompressor(); this.master.connect(comp).connect(c.destination);
    const len = c.sampleRate * 2, b = c.createBuffer(1, len, c.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.noise = b;
    const src = c.createBufferSource(); src.buffer = b; src.loop = true;
    this.hf = c.createBiquadFilter(); this.hf.type = 'bandpass'; this.hf.frequency.value = 900; this.hf.Q.value = .8;
    this.hg = c.createGain(); this.hg.gain.value = 0;
    src.connect(this.hf).connect(this.hg).connect(this.master); src.start();
  },
  hiss(level, freq) {
    if (!this.ctx) return; const t = this.ctx.currentTime;
    this.hg.gain.setTargetAtTime(level, t, .07); if (freq) this.hf.frequency.setTargetAtTime(freq, t, .1);
  },
  pop(r) {
    const c = this.ctx; if (!c || !this.on) return; const t = c.currentTime;
    const s = c.createBufferSource(); s.buffer = this.noise;
    const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = rand(1500, 3200) * (28 / r); f.Q.value = 1.4;
    const g = c.createGain(); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(1.1, t + .002); g.gain.exponentialRampToValueAtTime(.0001, t + .07);
    s.connect(f).connect(g).connect(this.master); s.start(t, Math.random() * 1.5, .09);
    const o = c.createOscillator(), og = c.createGain(); o.type = 'sine';
    o.frequency.setValueAtTime(240 * 28 / r, t); o.frequency.exponentialRampToValueAtTime(60, t + .06);
    og.gain.setValueAtTime(.5, t); og.gain.exponentialRampToValueAtTime(.0001, t + .07);
    o.connect(og).connect(this.master); o.start(t); o.stop(t + .08);
  },
  note(freq, vol, dur) {
    const c = this.ctx; if (!c || !this.on) return; const t = c.currentTime;
    const o = c.createOscillator(), o2 = c.createOscillator(), g = c.createGain();
    o.type = 'sine'; o2.type = 'triangle'; o.frequency.value = freq; o2.frequency.value = freq * 2;
    const g2 = c.createGain(); g2.gain.value = .18;
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .006); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); o2.connect(g2).connect(g); g.connect(this.master);
    o.start(t); o2.start(t); o.stop(t + dur + .05); o2.stop(t + dur + .05);
  },
  blorp(v, pitch) {
    const c = this.ctx; if (!c || !this.on) return; const t = c.currentTime;
    const o = c.createOscillator(), g = c.createGain(), f = c.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = 900; o.type = 'sine';
    const p = pitch || 1;
    o.frequency.setValueAtTime(320 * p, t); o.frequency.exponentialRampToValueAtTime(85 * p, t + .14);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.45 * v, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + .18);
    o.connect(f).connect(g).connect(this.master); o.start(t); o.stop(t + .2);
  },
  tick(f) {
    const c = this.ctx; if (!c || !this.on) return; const t = c.currentTime;
    const s = c.createBufferSource(); s.buffer = this.noise;
    const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = f * 2.2; bp.Q.value = 3;
    const g = c.createGain(); g.gain.setValueAtTime(.7, t); g.gain.exponentialRampToValueAtTime(.0001, t + .03);
    s.connect(bp).connect(g).connect(this.master); s.start(t, Math.random() * 1.5, .04);
    const o = c.createOscillator(), og = c.createGain(); o.frequency.value = f; o.type = 'triangle';
    og.gain.setValueAtTime(.16, t); og.gain.exponentialRampToValueAtTime(.0001, t + .05);
    o.connect(og).connect(this.master); o.start(t); o.stop(t + .06);
  },
  tone(f, level) {
    const c = this.ctx; if (!c) return; const t = c.currentTime;
    if (!this.osc) {
      this.osc = c.createOscillator(); this.osc.type = 'sine'; this.osc2 = c.createOscillator(); this.osc2.type = 'triangle';
      this.og = c.createGain(); this.og.gain.value = 0; const g2 = c.createGain(); g2.gain.value = .25;
      this.osc.connect(this.og); this.osc2.connect(g2).connect(this.og); this.og.connect(this.master); this.osc.start(); this.osc2.start();
    }
    if (f > 0) { this.osc.frequency.setTargetAtTime(f, t, .02); this.osc2.frequency.setTargetAtTime(f * 1.5, t, .02); }
    this.og.gain.setTargetAtTime(level, t, .05);
  },
  toggle() { this.on = !this.on; store.set('sound', this.on); if (this.master) this.master.gain.value = this.on ? .9 : 0; }
};

/* ---------------- Discoveries: every toy can report a phenomenon the first time it really happens ---------------- */
// Call discover('lava', 'split', 'Mitosis', 'A blob stretched too far tears in two.') from inside a toy when the
// system actually produces the effect. Shown once ever (remembered in localStorage), counted per toy for its chip.
const Disc = { seen: new Set(store.get('disc', [])), el: null, t: 0 };
function discover(mode, id, name, text) {
  const key = mode + ':' + id; if (Disc.seen.has(key)) return false;
  Disc.seen.add(key); store.set('disc', [...Disc.seen]);
  if (!Disc.el) { Disc.el = document.createElement('div'); Disc.el.className = 'disc out'; document.body.appendChild(Disc.el); }
  Disc.el.innerHTML = '<small>Discovered</small><b></b><p></p>';
  Disc.el.querySelector('b').textContent = name; Disc.el.querySelector('p').textContent = text;
  Disc.el.classList.remove('out'); clearTimeout(Disc.t); Disc.t = setTimeout(() => Disc.el.classList.add('out'), 3600);
  Snd.note(880, .05, .5); setTimeout(() => Snd.note(1318.5, .04, .6), 90);
  return true;
}
function discovered(mode) { let n = 0; for (const k of Disc.seen) if (k.startsWith(mode + ':')) n++; return n; }

/* ---------------- Pointers (multi-touch) ---------------- */
const P = new Map();
let pSerial = 0;

/* ================= FLUID: real-time Navier-Stokes on the GPU ================= */
const Fluid = (() => {
  const gl = glc.getContext('webgl2', { alpha: false, depth: false, stencil: false, antialias: false, preserveDrawingBuffer: false });
  if (!gl) return { ok: false };
  gl.getExtension('EXT_color_buffer_float'); gl.getExtension('EXT_color_buffer_half_float');
  const HF = gl.HALF_FLOAT;
  function supports(internal, format, type) {
    const tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texImage2D(gl.TEXTURE_2D, 0, internal, 4, 4, 0, format, type, null);
    const fb = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    const ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
    gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.deleteFramebuffer(fb); gl.deleteTexture(tex);
    return ok;

    if (supports(internal, format, HF)) return { internal, format, type: HF };
    if (internal === gl.R16F) return fmt(gl.RG16F, gl.RG);
    if (internal === gl.RG16F) return fmt(gl.RGBA16F, gl.RGBA);

  const fP = supports(gl.RGBA32F, gl.RGBA, gl.FLOAT) ? { internal: gl.RGBA32F, format: gl.RGBA, type: gl.FLOAT } : fRGBA;

  const VS = `#version 300 es
  precision highp float;

  function col(h, s, l) { const c = hsl(h, s, l); return `rgb(${c[0] * 255 | 0},${c[1] * 255 | 0},${c[2] * 255 | 0})`; }
  function drawOne(d) {
    const c = Math.cos(d.a), s = Math.sin(d.a), px = -d.dy, py = d.dx, L = d.L, WD = d.Wd, TH = d.T;
    const wob = d.wob ? Math.sin(d.wob * 30) * d.wob * 2 : 0;
    const x = d.x + d.dx * wob, y = d.y + d.dy * wob;
    let face, top;
    if (d.k === 'bell') { face = col(.12, .8, .5 + .08 * c); top = col(.13, .9, .78); }
    else if (d.k === 'gate') { face = d.open ? col(.36, .55, .45 + .08 * c) : col(.99, .65, .5 + .08 * c); top = d.open ? col(.36, .6, .75) : col(.99, .7, .75); }
    else if (d.k === 'sw') { face = col(.6, .1, .8 + .06 * c); top = col(.6, .1, .95); }
    else if (d.k === 'split') { face = col(d.h + .5, .6, .48 + .08 * c); top = col(d.h + .5, .5, .78); }
    else { const l = d.k === 's' ? .66 : d.k === 'b' ? .44 : .56; face = col(d.h, .75, l + .08 * c); top = col(d.h, .6, l + .26); }
    const bx = x - d.dx * TH / 2, by = y - d.dy * TH / 2, fx = x + d.dx * TH / 2, fy = y + d.dy * TH / 2, tip = L * s;
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    const sh = c * L * .35;
    ctx.beginPath();
    ctx.moveTo(bx + px * WD / 2, by + py * WD / 2); ctx.lineTo(bx - px * WD / 2, by - py * WD / 2);
    ctx.lineTo(fx - px * WD / 2 + tip * d.dx + sh, fy - py * WD / 2 + tip * d.dy + sh * 1.4); ctx.lineTo(fx + px * WD / 2 + tip * d.dx + sh, fy + py * WD / 2 + tip * d.dy + sh * 1.4);
    ctx.closePath(); ctx.fill();
    const t0x = bx + d.dx * tip, t0y = by + d.dy * tip, t1x = t0x + d.dx * TH * c, t1y = t0y + d.dy * TH * c;
    ctx.fillStyle = face;
    ctx.beginPath();
    ctx.moveTo(bx + px * WD / 2, by + py * WD / 2); ctx.lineTo(bx - px * WD / 2, by - py * WD / 2);
    ctx.lineTo(t0x - px * WD / 2, t0y - py * WD / 2); ctx.lineTo(t0x + px * WD / 2, t0y + py * WD / 2); ctx.closePath(); ctx.fill();
    ctx.fillStyle = top;
    ctx.beginPath();
    ctx.moveTo(t0x + px * WD / 2, t0y + py * WD / 2); ctx.lineTo(t0x - px * WD / 2, t0y - py * WD / 2);
    ctx.lineTo(t1x - px * WD / 2, t1y - py * WD / 2); ctx.lineTo(t1x + px * WD / 2, t1y + py * WD / 2); ctx.closePath(); ctx.fill();
    const mx = (bx + t0x + d.dx * TH * c) / 2, my = (by + t0y + d.dy * TH * c) / 2;
    if (d.k === 'split' && d.a < .4) { // the two directions it will send the wave
      ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 1.5; ctx.beginPath();
      for (const sg of [-1, 1]) { const [ux, uy] = rot(d.dx, d.dy, sg * .6); ctx.moveTo(x, y); ctx.lineTo(x + ux * 9, y + uy * 9); } ctx.stroke();
    } else if (d.k === 'sw' && d.a < .4) { ctx.strokeStyle = 'rgba(40,40,60,.8)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(x, y, 3.5, 0, 6.283); ctx.stroke(); }
    else if (d.k === 'bell' && d.a < .4) { ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.beginPath(); ctx.arc(x, y, 2.2, 0, 6.283); ctx.fill(); }
    else if (d.a > .3) { ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.beginPath(); ctx.arc(mx, my, d.k === 'b' ? 2.4 : 1.6, 0, Math.PI * 2); ctx.fill(); }
  }
  function drawBall(bl) {
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.arc(bl.x + 3, bl.y + 4, BR, 0, 6.283); ctx.fill();
    const gr = ctx.createRadialGradient(bl.x - 3, bl.y - 3, 1, bl.x, bl.y, BR);
    gr.addColorStop(0, '#fff'); gr.addColorStop(.35, '#c9d3e6'); gr.addColorStop(1, '#5a6478');
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(bl.x, bl.y, BR, 0, 6.283); ctx.fill();
  }
  const toWorld = p => ({ x: (p.x - W / 2) / cam.z + cam.x, y: (p.y - H / 2) / cam.z + cam.y });
  return {
    name: 'Dominoes', canvas: '2d', hint: 'Tap a domino to knock it over. Drag to lay a line of the chosen piece. Try the layouts.',
    enter() { if (!ds.length && !balls.length) spiral(); if (!cam.x) { cam.x = W / 2; cam.y = H / 2; } },
    resize() { layout(LAYOUTS[layoutI]); cam.x = W / 2; cam.y = H / 2; cam.z = 1; },
    down(p) {
      const q = toWorld(p);
      for (const bl of balls) { const e = Math.hypot(bl.x - q.x, bl.y - q.y); if (e < 20) { const s = 280 / (e || 1); bl.vx = (bl.x - q.x || 1) * s; bl.vy = (bl.y - q.y) * s; bl.fromDom = false; draw = null; return; } }
      let bestJ = -1, bd = 22 * 22;
      for (const j of near(q.x, q.y, 30)) { const d = ds[j]; if (d.st) continue; const e = (d.x - q.x) ** 2 + (d.y - q.y) ** 2; if (e < bd) { bd = e; bestJ = j; } }
      if (bestJ >= 0) {
        const d = ds[bestJ];
        if (d.k === 'gate') { d.open = !d.open; d.open0 = d.open; d.bySwitch = false; d.wob = 1; Snd.tick(d.open ? 1800 : 700); }
        else push(d, d.x - q.x || d.dx, d.y - q.y || d.dy, 4.5, null);
        draw = null; return;
      }
      if (place === 'ball') { addBall(q.x, q.y); draw = null; return; }
      draw = { p, lx: q.x, ly: q.y };
    },
    up(p) { if (draw && draw.p === p) draw = null; },
    frame(dt) {
      t += dt;
      if (draw) {
        const q = toWorld(draw.p), gap = K[place].gap, ddx = q.x - draw.lx, ddy = q.y - draw.ly, dl = Math.hypot(ddx, ddy);
        if (dl >= gap) {
          const n = Math.floor(dl / gap);
          for (let k = 1; k <= n; k++) { const x = draw.lx + ddx / dl * gap, y = draw.ly + ddy / dl * gap; add(x, y, ddx / dl, ddy / dl, place); draw.lx = x; draw.ly = y; }
          if (ds.length > 1600) { ds.splice(0, ds.length - 1600); reindex(); }
        }
      }
      // slow-mo follow cam: zoom in on the wavefront while a chain is running
      const active = t - lastPushT < .5 && lastHit && !rew;
      const tz = follow && active ? 2 : 1, tx = follow && active ? lastHit.x : W / 2, ty = follow && active ? lastHit.y : H / 2;
      const k = Math.min(1, dt * (follow && active ? 3 : 2));
      cam.z += (tz - cam.z) * k; cam.x += (tx - cam.x) * k; cam.y += (ty - cam.y) * k;
      const ts = follow && active ? .3 : 1;
      if (rew) rewind(dt);
      else { const sub = 3; for (let s = 0; s < sub; s++) update(Math.min(dt, 1 / 30) * ts / sub); }
      ctx.fillStyle = '#12100f'; ctx.fillRect(0, 0, W, H);
      const fl = ctx.createRadialGradient(W / 2, H * .45, 20, W / 2, H * .45, Math.max(W, H) * .75);
      fl.addColorStop(0, '#2a2420'); fl.addColorStop(1, '#100e0d'); ctx.fillStyle = fl; ctx.fillRect(0, 0, W, H);
      ctx.setTransform(DPR * cam.z, 0, 0, DPR * cam.z, DPR * (W / 2 - cam.x * cam.z), DPR * (H / 2 - cam.y * cam.z));
      const order = ds.slice().sort((a, b) => b.a - a.a);
      for (const d of order) drawOne(d);
      for (const bl of balls) drawBall(bl);
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      if (follow && cam.z > 1.05) { ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.font = '600 11px system-ui,sans-serif'; ctx.fillText('SLOW-MO  ·  ' + curChain, 16, bounds().bottom - 12); }
    },
    chips() {
      let standing = 0; for (const d of ds) if (!d.st) standing++;
      const n = discovered('dom');
      const list = [
        { label: `${standing} up · best ${best}`, stat: true },
        { label: '+ ' + (place === 'ball' ? 'Ball' : K[place].name), on: true, act() { place = PLACE[(PLACE.indexOf(place) + 1) % PLACE.length]; } },
        { label: LAYOUTS[layoutI] + ' ▸', act() { layoutI = (layoutI + 1) % LAYOUTS.length; layout(LAYOUTS[layoutI]); } },
        { label: 'Slow-mo', on: follow, act() { follow = !follow; } },
        { label: 'Rewind', act() { if (fallOrder.length && !rew) rew = { list: fallOrder.slice().reverse(), i: 0, t: 0 }; } },
        { label: 'Clear', act() { reset(); } }
      ];
      if (n) list.push({ label: `✦ ${n}/10`, stat: true });
      return list;
    }
  };
})();

/* ---------------- Terrarium: the world simulator, opened from the Sand tab (source in world/) ---------------- */
let worldApp = null, worldOpen = false;
function openWorld() {
  if (!window.Terrarium) return;
  Snd.hiss(0); Snd.tone(0, 0);
  if (!worldApp) worldApp = window.Terrarium.mount(document.body, { onClose: closeWorld, closeLabel: 'Back to Swirl Room' });
  else worldApp.show();
  worldOpen = true; store.set('world', 1);
  if (location.hash !== '#terrarium') history.replaceState(null, '', '#terrarium');
}
function closeWorld() {
  if (worldApp) worldApp.hide();
  worldOpen = false; store.set('world', 0);
  history.replaceState(null, '', '#' + curKey);
}

/* ---------------- Shell ---------------- */
const MODES = { fluid: Fluid.ok ? Fluid : FluidFallback, lava: Lava, sand: Sand, cym: Cym, slime: Slime, dom: Dom, pend: Pend, bub: Bub };
const ORDER = ['fluid', 'lava', 'sand', 'cym', 'slime', 'dom', 'pend', 'bub'];
let curKey = null, cur = null, lastChips = '';
const seenHint = {};
function renderChips() {
  const list = cur.chips ? cur.chips() : [];
  list.push({ label: Snd.on ? 'Sound on' : 'Sound off', on: false, act() { Snd.unlock(); Snd.toggle(); } });
  const sig = list.map(c => c.label + (c.on ? 1 : 0)).join('|');
  if (sig === lastChips) return; lastChips = sig;
  chipsEl.innerHTML = '';
  list.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'chip' + (c.on ? ' on' : '') + (c.stat ? ' stat' : ''); b.textContent = c.label; b.id = 'chip-' + curKey + '-' + i;
    if (c.act) b.addEventListener('click', () => { c.act(); lastChips = ''; renderChips(); });
    else b.disabled = true;
    chipsEl.appendChild(b);
  });
}
function setMode(k) {
  if (!MODES[k] || k === curKey) return;
  if (cur && cur.leave) cur.leave();
  for (const p of P.values()) { if (cur && cur.up) cur.up(p); }
  P.clear();
  curKey = k; cur = MODES[k]; store.set('mode', k);
  Snd.hiss(0); Snd.tone(0, 0);
  subEl.textContent = '';
  glc.style.visibility = cur.canvas === 'gl' ? 'visible' : 'hidden';
  c2.style.visibility = cur.canvas === 'gl' ? 'hidden' : 'visible';
  if (cur.enter) cur.enter();
  document.querySelectorAll('.tab').forEach(t => { const on = t.dataset.m === k; t.classList.toggle('on', on); t.setAttribute('aria-pressed', on); });
  modeNameEl.textContent = { fluid: 'Fluid', lava: 'Lava lamp', sand: 'Sand', cym: 'Cymatics', slime: 'Slime', dom: 'Dominoes', pend: 'Pendulum wave', bub: 'Bubble wrap' }[k];
  const tabEl = $('#tab-' + k); if (tabEl && tabEl.scrollIntoView) try { tabEl.scrollIntoView({ block: 'nearest', inline: 'center' }); } catch (e) {}
  hintEl.textContent = cur.hint || '';
  hintEl.classList.toggle('gone', !!seenHint[k] || !cur.hint);
  lastChips = ''; renderChips();
}
tabsEl.addEventListener('click', e => { const t = e.target.closest('.tab'); if (t) setMode(t.dataset.m); });
addEventListener('keydown', e => { if (worldOpen) return; if (e.target && e.target.tagName === 'INPUT') return; const i = '12345678'.indexOf(e.key); if (i >= 0) setMode(ORDER[i]); });

stage.addEventListener('pointerdown', e => {
  try { stage.setPointerCapture(e.pointerId); } catch (_) {}
  Snd.unlock();
  const p = { id: e.pointerId, x: e.clientX, y: e.clientY, px: e.clientX, py: e.clientY, moved: false, n: pSerial++, t0: performance.now() };
  P.set(e.pointerId, p);
  if (cur.down) cur.down(p);
  if (cur.move) cur.move(p);
  if (!seenHint[curKey]) { seenHint[curKey] = true; setTimeout(() => hintEl.classList.add('gone'), 1200); }
});
stage.addEventListener('pointermove', e => {
  const p = P.get(e.pointerId); if (!p) return;
  p.x = e.clientX; p.y = e.clientY; p.moved = true;
  if (cur.move) cur.move(p);
});
const end = e => { const p = P.get(e.pointerId); if (!p) return; if (cur.up) cur.up(p); P.delete(e.pointerId); };
stage.addEventListener('pointerup', end); stage.addEventListener('pointercancel', end);
stage.addEventListener('contextmenu', e => e.preventDefault());

function sizeCanvas() {
  W = innerWidth; H = innerHeight; DPR = Math.min(devicePixelRatio || 1, 2);
  c2.width = Math.floor(W * DPR); c2.height = Math.floor(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
let rsz = 0;
addEventListener('resize', () => {
  cancelAnimationFrame(rsz);
  rsz = requestAnimationFrame(() => { sizeCanvas(); for (const k in MODES) if (MODES[k].resize) try { MODES[k].resize(); } catch (err) { console.error(err); } });
});
sizeCanvas();
const hashMode = location.hash.slice(1);
setMode(hashMode === 'terrarium' ? 'sand' : MODES[hashMode] ? hashMode : (MODES[store.get('mode', 'fluid')] ? store.get('mode', 'fluid') : 'fluid'));
if (hashMode === 'terrarium' || (curKey === 'sand' && store.get('world', 0))) openWorld();

let last = performance.now();
function loop(now) {
  const dt = Math.min(.033, Math.max(0, (now - last) / 1000)); last = now;
  if (!worldOpen) try { cur.frame(dt, now / 1000); } catch (err) { console.error(err); }
  for (const p of P.values()) { p.px = p.x; p.py = p.y; }
  renderChips();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
document.addEventListener('visibilitychange', () => { if (document.hidden) Snd.hiss(0); last = performance.now(); });
})();
</script>
